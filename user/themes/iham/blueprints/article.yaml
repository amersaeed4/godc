title: Article / information page
extends@: default
form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          fields:
            hero_s:
              type: section
              title: Hero
              underline: true
            header.hero.eyebrow:
              type: text
              label: Eyebrow
            header.hero.title:
              type: text
              label: Title
            header.hero.lead:
              type: textarea
              label: Lead paragraph
              rows: 3
              help: Markdown is supported. Separate paragraphs with a blank line.
            header.hero.image:
              type: pagemediaselect
              label: Image
              preview_images: true
            sb_s:
              type: section
              title: Layout
              underline: true
            header.sidebar:
              type: toggle
              label: "Show sidebar (page list + contact)"
              highlight: 1
              default: 1
              options:
                1: "Yes"
                0: "No"
              validate:
                type: bool
            header.doctor:
              type: text
              label: Doctor shown in the sidebar
              help: Route of a doctor page, e.g. /our-doctors/dr-mohsin-gillani. Leave blank for none.
            header.children_title:
              type: text
              label: Heading above sub-page cards
            cd_s:
              type: section
              title: Step cards (optional)
              underline: true
            header.cards_title:
              type: text
              label: Section title
            header.cards:
              type: list
              label: Cards
              style: vertical
              collapsed: true
              btn_label: Add card
              fields:
                .title:
                  type: text
                  label: Title
                .text:
                  type: textarea
                  label: Text
                  rows: 3
                .icon:
                  type: select
                  label: Icon
                  options:
                    stethoscope: Stethoscope
                    heart: Heart
                    apple: Apple
                    activity: Activity
                    moon: Moon
                    brain: Brain
                    users: Users
                    shield: Shield
                    leaf: Leaf
                    clipboard: Clipboard
                    chart: Chart
                    book: Book
                    smile: Smile
                    award: Award
                    building: Building
                    globe: Globe
                    pill: Pill
                    droplet: Droplet
                    bone: Bone
                    scale: Scale
                    flask: Flask
                    baby: Baby
                    file: File
                    phone: Phone
                    mail: Mail
                    calendar: Calendar
                    clock: Clock
                    check: Check
            lk_s:
              type: section
              title: Link list (optional)
              underline: true
            header.links_title:
              type: text
              label: Section title
            header.links:
              type: list
              label: Links
              style: vertical
              collapsed: true
              btn_label: Add link
              fields:
                .title:
                  type: text
                  label: Label
                .link:
                  type: text
                  label: Link
            fq_s:
              type: section
              title: FAQs (optional)
              underline: true
            header.faqs_title:
              type: text
              label: Section title
            header.faqs:
              type: list
              label: Questions
              style: vertical
              collapsed: true
              btn_label: Add question
              fields:
                .question:
                  type: text
                  label: Question
                .answer:
                  type: textarea
                  label: Answer
                  rows: 5
                  help: Markdown is supported. Separate paragraphs with a blank line.
            cta_s:
              type: section
              title: Call to action
              underline: true
            header.cta.eyebrow:
              type: text
              label: Eyebrow
            header.cta.title:
              type: text
              label: Title
            header.cta.text:
              type: textarea
              label: Text
              rows: 3
              help: Markdown is supported. Separate paragraphs with a blank line.
            header.cta.button_label:
              type: text
              label: Button label
            header.cta.button_link:
              type: text
              label: Button link
              placeholder: "/book-a-consultation"
        seo:
          type: tab
          title: SEO & Sharing
          fields:
            seo_s:
              type: section
              title: Search engine optimisation
              underline: true
            header.seo_title:
              type: text
              label: SEO title
              help: "Shown in browser tabs and search results. Leave blank to use \"Page title | Site name\". Aim for under 60 characters."
            header.metadata.description:
              type: textarea
              label: Meta description
              rows: 3
              help: "Shown under the title in search results. Aim for 120–160 characters."
            header.metadata.keywords:
              type: text
              label: Meta keywords
              help: "Comma-separated. Optional – most search engines ignore these, but some directories use them."
            header.robots:
              type: select
              label: Search engine visibility
              options:
                index,follow: Visible to search engines (default)
                noindex,follow: Hide from search (noindex)
                noindex,nofollow: Hide and do not follow links
              default: index,follow
            header.canonical:
              type: text
              label: Canonical URL
              help: Only set this if the same content lives at another address.
            social_s:
              type: section
              title: Social sharing & listings
              underline: true
            header.og_image:
              type: pagemediaselect
              label: Social sharing image
              preview_images: true
              help: "Recommended 1200 × 630 px. Falls back to the card image, then the site default."
            header.summary:
              type: textarea
              label: Short summary
              rows: 3
              help: Shown on cards and listing pages that link to this page.
            header.card_image:
              type: pagemediaselect
              label: Card image
              preview_images: true
              help: Image shown on cards that link to this page.
            header.nav_group:
              type: text
              label: Menu group
              help: "Optional. Groups pages under a heading inside the \"Our Services\" dropdown."
        options:
          fields:
            publishing:
              fields:
                header.metadata:
                  unset@: true
