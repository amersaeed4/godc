title: Patient resources
extends@: default
form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          fields:
            content:
              unset@: true
            header.media_order:
              type: pagemedia
              label: Page media
              help: Upload images here, then pick them in the fields below.
            hero_s:
              type: section
              title: Hero
              underline: true
            header.hero.eyebrow:
              type: text
              label: Eyebrow (small label above title)
            header.hero.title:
              type: text
              label: Title
            header.hero.text:
              type: textarea
              label: Intro text
              rows: 4
              help: Markdown is supported. Separate paragraphs with a blank line.
            header.hero.image:
              type: pagemediaselect
              label: Image
              preview_images: true
            header.hero.links:
              type: list
              label: Quick links
              style: vertical
              collapsed: true
              btn_label: Add link
              fields:
                .label:
                  type: text
                  label: Label
                .target:
                  type: text
                  label: Section ID
                  placeholder: prep
            pr_s:
              type: section
              title: Preparing for your consultation
              underline: true
            header.prep.eyebrow:
              type: text
              label: Eyebrow
            header.prep.title:
              type: text
              label: Title
            header.prep.text:
              type: textarea
              label: Text
              rows: 4
              help: Markdown is supported. Separate paragraphs with a blank line.
            header.prep.list_title:
              type: text
              label: List heading
            header.prep.items:
              type: textarea
              label: List items
              rows: 6
              help: One item per line.
            ex_s:
              type: section
              title: What to expect
              underline: true
            header.expect.eyebrow:
              type: text
              label: Eyebrow
            header.expect.title:
              type: text
              label: Title
            header.expect.text:
              type: textarea
              label: Text
              rows: 4
              help: Markdown is supported. Separate paragraphs with a blank line.
            header.expect.list_title:
              type: text
              label: List heading
            header.expect.items:
              type: textarea
              label: List items
              rows: 6
              help: One item per line.
            fu_s:
              type: section
              title: Follow-up care
              underline: true
            header.followup.eyebrow:
              type: text
              label: Eyebrow
            header.followup.title:
              type: text
              label: Title
            header.followup.text:
              type: textarea
              label: Text
              rows: 5
              help: Markdown is supported. Separate paragraphs with a blank line.
            fq_s:
              type: section
              title: Frequently asked questions
              underline: true
            header.faqs.title:
              type: text
              label: Section title
            header.faqs.items:
              type: list
              label: Questions
              style: vertical
              collapsed: true
              btn_label: Add question
              fields:
                .question:
                  type: text
                  label: Question
                .answer:
                  type: textarea
                  label: Answer
                  rows: 6
                  help: Markdown is supported. Separate paragraphs with a blank line.
            ed_s:
              type: section
              title: Patient education
              underline: true
            header.education.eyebrow:
              type: text
              label: Eyebrow
            header.education.title:
              type: text
              label: Title
            header.education.text:
              type: textarea
              label: Text
              rows: 3
              help: Markdown is supported. Separate paragraphs with a blank line.
            header.education.image:
              type: pagemediaselect
              label: Image
              preview_images: true
            header.education.button_label:
              type: text
              label: Button label
            header.education.button_link:
              type: text
              label: Button link
              placeholder: "/book-a-consultation"
            cta_s:
              type: section
              title: Call to action
              underline: true
            header.cta.eyebrow:
              type: text
              label: Eyebrow
            header.cta.title:
              type: text
              label: Title
            header.cta.text:
              type: textarea
              label: Text
              rows: 3
              help: Markdown is supported. Separate paragraphs with a blank line.
            header.cta.button_label:
              type: text
              label: Button label
            header.cta.button_link:
              type: text
              label: Button link
              placeholder: "/book-a-consultation"
            bk_s:
              type: section
              title: Booking form
              underline: true
            header.booking.title:
              type: text
              label: Title
            header.booking.form:
              type: select
              label: Form
              options:
                booking-appointment: Appointment request (name, phone, email, type)
                quick-booking: Quick booking (with date & time)
                consultation: Full consultation form
                corporate-enquiry: Corporate enquiry
                global-enquiry: Global health enquiry
                review: Patient feedback
              help: "Form definitions live in the hidden \"Site Forms\" page (Pages → forms)."
        seo:
          type: tab
          title: SEO & Sharing
          fields:
            seo_s:
              type: section
              title: Search engine optimisation
              underline: true
            header.seo_title:
              type: text
              label: SEO title
              help: "Shown in browser tabs and search results. Leave blank to use \"Page title | Site name\". Aim for under 60 characters."
            header.metadata.description:
              type: textarea
              label: Meta description
              rows: 3
              help: "Shown under the title in search results. Aim for 120–160 characters."
            header.metadata.keywords:
              type: text
              label: Meta keywords
              help: "Comma-separated. Optional – most search engines ignore these, but some directories use them."
            header.robots:
              type: select
              label: Search engine visibility
              options:
                index,follow: Visible to search engines (default)
                noindex,follow: Hide from search (noindex)
                noindex,nofollow: Hide and do not follow links
              default: index,follow
            header.canonical:
              type: text
              label: Canonical URL
              help: Only set this if the same content lives at another address.
            social_s:
              type: section
              title: Social sharing & listings
              underline: true
            header.og_image:
              type: pagemediaselect
              label: Social sharing image
              preview_images: true
              help: "Recommended 1200 × 630 px. Falls back to the card image, then the site default."
            header.summary:
              type: textarea
              label: Short summary
              rows: 3
              help: Shown on cards and listing pages that link to this page.
            header.card_image:
              type: pagemediaselect
              label: Card image
              preview_images: true
              help: Image shown on cards that link to this page.
            header.nav_group:
              type: text
              label: Menu group
              help: "Optional. Groups pages under a heading inside the \"Our Services\" dropdown."
        options:
          fields:
            publishing:
              fields:
                header.metadata:
                  unset@: true
