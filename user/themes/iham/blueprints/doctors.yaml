title: Our Doctors landing
extends@: default
form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          fields:
            content:
              unset@: true
            header.media_order:
              type: pagemedia
              label: Page media
              help: Upload images here, then pick them in the fields below.
            hero_s:
              type: section
              title: Hero
              underline: true
            header.hero.eyebrow:
              type: text
              label: Eyebrow (small label above title)
            header.hero.title:
              type: text
              label: Title
            header.hero.text:
              type: textarea
              label: Intro text
              rows: 4
              help: Markdown is supported. Separate paragraphs with a blank line.
            ch_s:
              type: section
              title: Doctor cards
              underline: true
              text: "The doctor pages inside this section appear as cards in menu order. The first one is shown as the lead doctor – drag pages in the Pages list to change the order."
            header.children_title:
              type: text
              label: Heading above the cards
        seo:
          type: tab
          title: SEO & Sharing
          fields:
            seo_s:
              type: section
              title: Search engine optimisation
              underline: true
            header.seo_title:
              type: text
              label: SEO title
              help: "Shown in browser tabs and search results. Leave blank to use \"Page title | Site name\". Aim for under 60 characters."
            header.metadata.description:
              type: textarea
              label: Meta description
              rows: 3
              help: "Shown under the title in search results. Aim for 120–160 characters."
            header.metadata.keywords:
              type: text
              label: Meta keywords
              help: "Comma-separated. Optional – most search engines ignore these, but some directories use them."
            header.robots:
              type: select
              label: Search engine visibility
              options:
                index,follow: Visible to search engines (default)
                noindex,follow: Hide from search (noindex)
                noindex,nofollow: Hide and do not follow links
              default: index,follow
            header.canonical:
              type: text
              label: Canonical URL
              help: Only set this if the same content lives at another address.
            social_s:
              type: section
              title: Social sharing & listings
              underline: true
            header.og_image:
              type: pagemediaselect
              label: Social sharing image
              preview_images: true
              help: "Recommended 1200 × 630 px. Falls back to the card image, then the site default."
            header.summary:
              type: textarea
              label: Short summary
              rows: 3
              help: Shown on cards and listing pages that link to this page.
            header.card_image:
              type: pagemediaselect
              label: Card image
              preview_images: true
              help: Image shown on cards that link to this page.
            header.nav_group:
              type: text
              label: Menu group
              help: "Optional. Groups pages under a heading inside the \"Our Services\" dropdown."
        options:
          fields:
            publishing:
              fields:
                header.metadata:
                  unset@: true
