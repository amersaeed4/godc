title: About
extends@: default
form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          fields:
            content:
              unset@: true
            header.media_order:
              type: pagemedia
              label: Page media
              help: Upload images here, then pick them in the fields below.
            hero_s:
              type: section
              title: Hero
              underline: true
            header.hero.eyebrow:
              type: text
              label: Eyebrow (small label above title)
            header.hero.title:
              type: text
              label: Title
            header.hero.image:
              type: pagemediaselect
              label: Image
              preview_images: true
            who_s:
              type: section
              title: Who we are
              underline: true
            header.who.eyebrow:
              type: text
              label: Eyebrow
            header.who.title:
              type: text
              label: Title
            header.who.text:
              type: textarea
              label: Text
              rows: 10
              help: Markdown is supported. Separate paragraphs with a blank line.
            mv_s:
              type: section
              title: Mission & vision
              underline: true
            header.mission.title:
              type: text
              label: Mission title
            header.mission.text:
              type: textarea
              label: Mission text
              rows: 4
              help: Markdown is supported. Separate paragraphs with a blank line.
            header.vision.title:
              type: text
              label: Vision title
            header.vision.text:
              type: textarea
              label: Vision text
              rows: 4
              help: Markdown is supported. Separate paragraphs with a blank line.
            val_s:
              type: section
              title: Values
              underline: true
            header.values.title:
              type: text
              label: Section title
            header.values.items:
              type: list
              label: Values
              style: vertical
              collapsed: true
              btn_label: Add value
              fields:
                .title:
                  type: text
                  label: Title
                .text:
                  type: textarea
                  label: Text
                  rows: 3
                .icon:
                  type: select
                  label: Icon
                  options:
                    stethoscope: Stethoscope
                    heart: Heart
                    apple: Apple
                    activity: Activity
                    moon: Moon
                    brain: Brain
                    users: Users
                    shield: Shield
                    leaf: Leaf
                    clipboard: Clipboard
                    chart: Chart
                    book: Book
                    smile: Smile
                    award: Award
                    building: Building
                    globe: Globe
                    pill: Pill
                    droplet: Droplet
                    bone: Bone
                    scale: Scale
                    flask: Flask
                    baby: Baby
                    file: File
                    phone: Phone
                    mail: Mail
                    calendar: Calendar
                    clock: Clock
                    check: Check
            team_s:
              type: section
              title: Core team
              underline: true
            header.team.title:
              type: text
              label: Section title
            header.team.text:
              type: textarea
              label: Intro
              rows: 2
            header.team.members:
              type: list
              label: Team members
              style: vertical
              collapsed: true
              btn_label: Add team member
              fields:
                .image:
                  type: pagemediaselect
                  label: Photo
                  preview_images: true
                .name:
                  type: text
                  label: Name
                .role:
                  type: text
                  label: Role
                .credentials:
                  type: text
                  label: Qualifications
                .affiliations:
                  type: textarea
                  label: Affiliations
                  rows: 3
            re_s:
              type: section
              title: Why patients choose us
              underline: true
            header.reasons.title:
              type: text
              label: Title
            header.reasons.text:
              type: text
              label: Subtitle
            header.reasons.items:
              type: textarea
              label: Reasons
              rows: 6
              help: One item per line.
            cta_s:
              type: section
              title: Call to action
              underline: true
            header.cta.eyebrow:
              type: text
              label: Eyebrow
            header.cta.title:
              type: text
              label: Title
            header.cta.text:
              type: textarea
              label: Text
              rows: 3
              help: Markdown is supported. Separate paragraphs with a blank line.
            header.cta.button_label:
              type: text
              label: Button label
            header.cta.button_link:
              type: text
              label: Button link
              placeholder: "/book-a-consultation"
        seo:
          type: tab
          title: SEO & Sharing
          fields:
            seo_s:
              type: section
              title: Search engine optimisation
              underline: true
            header.seo_title:
              type: text
              label: SEO title
              help: "Shown in browser tabs and search results. Leave blank to use \"Page title | Site name\". Aim for under 60 characters."
            header.metadata.description:
              type: textarea
              label: Meta description
              rows: 3
              help: "Shown under the title in search results. Aim for 120–160 characters."
            header.metadata.keywords:
              type: text
              label: Meta keywords
              help: "Comma-separated. Optional – most search engines ignore these, but some directories use them."
            header.robots:
              type: select
              label: Search engine visibility
              options:
                index,follow: Visible to search engines (default)
                noindex,follow: Hide from search (noindex)
                noindex,nofollow: Hide and do not follow links
              default: index,follow
            header.canonical:
              type: text
              label: Canonical URL
              help: Only set this if the same content lives at another address.
            social_s:
              type: section
              title: Social sharing & listings
              underline: true
            header.og_image:
              type: pagemediaselect
              label: Social sharing image
              preview_images: true
              help: "Recommended 1200 × 630 px. Falls back to the card image, then the site default."
            header.summary:
              type: textarea
              label: Short summary
              rows: 3
              help: Shown on cards and listing pages that link to this page.
            header.card_image:
              type: pagemediaselect
              label: Card image
              preview_images: true
              help: Image shown on cards that link to this page.
            header.nav_group:
              type: text
              label: Menu group
              help: "Optional. Groups pages under a heading inside the \"Our Services\" dropdown."
        options:
          fields:
            publishing:
              fields:
                header.metadata:
                  unset@: true
