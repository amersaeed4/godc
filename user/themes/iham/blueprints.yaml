name: GODC
slug: iham
type: theme
version: 1.0.0
description: Professional medical theme for GODC. Every section of every page, plus site-wide contact details, navigation extras and SEO defaults, is editable from the admin.
icon: heartbeat
author:
  name: GODC
  email: info@godc.pk
license: MIT
compatibility:
  grav: ['2.0']
dependencies:
  - { name: grav, version: '>=2.0.0' }

form:
  validation: loose
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        general:
          type: tab
          title: Brand & Contact
          fields:
            brand_section:
              type: section
              title: Brand
              underline: true
            brand.name:
              type: text
              label: Business name
            brand.tagline:
              type: text
              label: Tagline
            contact_section:
              type: section
              title: Contact details
              underline: true
              text: 'Used in the header, footer, contact page, booking forms and structured data. Change them here once and they update everywhere.'
            contact.phone:
              type: text
              label: Phone
              placeholder: '+92 300 0000000'
            contact.email:
              type: email
              label: Email
            contact.address:
              type: text
              label: Street address
            contact.locality:
              type: text
              label: City
            contact.region:
              type: text
              label: Region / province
            contact.country:
              type: text
              label: Country code
              help: Two-letter ISO code, e.g. PK
              size: small
            contact.map_link:
              type: text
              label: Directions link
              help: Link opened by "Get directions" (e.g. a Google Maps share link).
            contact.map_embed:
              type: textarea
              label: Map embed URL
              help: 'Optional. Paste only the iframe "src" URL from Google Maps → Share → Embed a map. Shown on the contact page.'
              rows: 2
            locations_section:
              type: section
              title: Clinic locations
              underline: true
              text: 'Every clinic listed here appears on the contact page, in the footer and in the top bar. Put the clinic you want to promote first.'
            locations:
              type: list
              label: Clinics
              style: vertical
              collapsed: true
              btn_label: Add clinic
              fields:
                .name:
                  type: text
                  label: Clinic name
                .short:
                  type: text
                  label: Short label (top bar)
                .doctor:
                  type: text
                  label: Doctor
                .address:
                  type: text
                  label: Address
                .phone:
                  type: text
                  label: Phone
                .email:
                  type: text
                  label: Email
                .hours:
                  type: text
                  label: Opening hours
                .map_link:
                  type: text
                  label: Directions link
            hours_section:
              type: section
              title: Opening hours
              underline: true
            hours:
              type: list
              label: Opening hours
              style: vertical
              collapsed: false
              btn_label: Add hours
              fields:
                .days:
                  type: text
                  label: Days
                .time:
                  type: text
                  label: Hours
            social_section:
              type: section
              title: Social profiles
              underline: true
            social.facebook:
              type: text
              label: Facebook URL
            social.instagram:
              type: text
              label: Instagram URL
            social.linkedin:
              type: text
              label: LinkedIn URL
            social.youtube:
              type: text
              label: YouTube URL
            social.x:
              type: text
              label: X (Twitter) URL
        header_footer:
          type: tab
          title: Header & Footer
          fields:
            header_section:
              type: section
              title: Header
              underline: true
            header.show_topbar:
              type: toggle
              label: Show top bar
              highlight: 1
              default: 1
              options:
                1: Yes
                0: No
              validate:
                type: bool
            header.topbar_label:
              type: text
              label: Top bar label
            header.cta_label:
              type: text
              label: Header button label
            header.cta_link:
              type: text
              label: Header button link
            footer_section:
              type: section
              title: Footer
              underline: true
            footer.about:
              type: textarea
              label: Footer introduction
              rows: 3
            footer.copyright:
              type: text
              label: Copyright holder
              help: 'The year is added automatically.'
            footer.credit:
              type: text
              label: Credit line (optional)
            footer.disclaimer:
              type: textarea
              label: Medical disclaimer
              rows: 3
        seo:
          type: tab
          title: SEO Defaults
          fields:
            seo_section:
              type: section
              title: Search & sharing defaults
              underline: true
              text: 'Each page can override these in its own "SEO & Sharing" tab.'
            seo.site_name:
              type: text
              label: Site name
            seo.title_separator:
              type: text
              label: Title separator
              size: small
            seo.default_description:
              type: textarea
              label: Default meta description
              rows: 3
              help: Used when a page has no description of its own. Keep it under 160 characters.
            seo.og_image:
              type: file
              label: Default social sharing image
              help: 'Recommended 1200 × 630 px. Used when a page has no image of its own.'
              destination: 'theme://images/uploads'
              multiple: false
              accept:
                - image/*
            seo.twitter_handle:
              type: text
              label: X (Twitter) handle
              placeholder: '@yourhandle'
            seo.business_type:
              type: select
              label: Structured-data business type
              options:
                MedicalClinic: Medical clinic
                MedicalBusiness: Medical business
                Physician: Physician
                Dentist: Dentist
                HealthAndBeautyBusiness: Health and beauty business
            seo.price_range:
              type: text
              label: Price range (optional)
              placeholder: '$$'
            verify_section:
              type: section
              title: Verification & analytics
              underline: true
            seo.google_site_verification:
              type: text
              label: Google Search Console verification code
            seo.bing_site_verification:
              type: text
              label: Bing Webmaster verification code
            seo.analytics_id:
              type: text
              label: Google Analytics measurement ID
              placeholder: G-XXXXXXXXXX
