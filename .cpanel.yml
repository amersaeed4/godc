---
deployment:
  tasks:
    - export DEPLOYPATH=/home/godcpk/public_html/
    - /bin/cp -R index.php .htaccess composer.json bin system vendor user webserver-configs $DEPLOYPATH
    - /usr/bin/find $DEPLOYPATH -type d -not -path "*/cgi-bin*" -exec chmod 755 {} \;
    - /usr/bin/find $DEPLOYPATH -type f -not -path "*/cgi-bin*" -exec chmod 644 {} \;
    - /bin/rm -rf $DEPLOYPATH/cache/*
